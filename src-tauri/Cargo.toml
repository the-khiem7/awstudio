[package]
name = "awsandbox"
version = "0.0.0"
description = "Local AWS Console experience over aws-emulator"
edition = "2021"

[lib]
name = "awsandbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aws-sdk-s3 = "1.159.0"
aws-sdk-sts = "1.126.0"
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-aws-lc"] }
aws-types = "1.7.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
