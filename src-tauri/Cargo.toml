[package]
name = "awstudio"
version = "0.0.0"
description = "Local AWS Console experience over aws-emulator"
edition = "2021"

[lib]
name = "awstudio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aws-sdk-cloudwatchlogs = "1.165.0"
aws-sdk-dynamodb = "1.139.0"
aws-sdk-eventbridge = "1.129.0"
aws-sdk-iam = "1.136.0"
aws-sdk-kms = "1.131.0"
aws-sdk-lambda = "1.159.0"
aws-sdk-s3 = "1.159.0"
aws-sdk-secretsmanager = "1.128.0"
aws-sdk-sns = "1.123.0"
aws-sdk-sqs = "1.121.0"
aws-sdk-ssm = "1.137.0"
aws-sdk-sts = "1.126.0"
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-aws-lc"] }
aws-smithy-types = "1.9.4"
aws-types = "1.7.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "time"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
